services:
  postgres:
    image: postgres:16-alpine
    container_name: algomalgo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME 을 .env 에 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME 을 .env 에 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
    ports:
      # 비밀값이 아니므로 기본값을 둔다. 로컬 DB 툴 접속용으로만 쓴다.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ 는 compose 가 아니라 컨테이너 안의 셸이 환경변수를 읽게 한다
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: algomalgo-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정하세요}
      # redis-cli 가 이 변수를 읽어 인증한다 (명령줄에 비밀번호를 노출하지 않음)
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # --- 아래는 --profile full 일 때만 실행 (backend/Dockerfile, nginx/default.conf 필요) ---

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algomalgo-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: Asia/Seoul
      # 컨테이너 안에서는 서비스 이름과 컨테이너 포트를 쓴다 (호스트 포트 DB_PORT/REDIS_PORT 와 별개)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME 을 .env 에 설정하세요}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME 을 .env 에 설정하세요}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 를 .env 에 설정하세요}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DDL_AUTO: ${DDL_AUTO:-validate}
      # application.yml 의 prod 기본값(WARN)과 같게 둔다
      SQL_LOG_LEVEL: ${SQL_LOG_LEVEL:-WARN}
      # GitHub OAuth (값은 .env 에만 둔다)
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID 를 .env 에 설정하세요}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET 을 .env 에 설정하세요}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app-network

  nginx:
    profiles: ["full"]
    image: nginx:1.27-alpine
    container_name: algomalgo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
